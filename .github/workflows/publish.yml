name: Publish

# Publishes to npm with trusted publishing (OIDC): no npm token is stored anywhere. npm checks that the request comes
# from this repository, this workflow file and the "npm" environment, and adds a provenance attestation.
#
# Release: bump "version" in package.json, commit, then push a matching tag:
#   git tag v0.2.0 && git push origin v0.2.0
# A prerelease is the same with a version that has a "-": version 0.5.0-next.1, tag v0.5.0-next.1 -> npm dist-tag next;
# latest stays put.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # lets the job request the OIDC token npm verifies

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - name: Tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      # v0.1.0 was published by hand (npm needs a package to exist before it trusts a workflow), so its tag only checks.
      - name: Already on npm?
        id: published
        run: |
          if npm view "electron-cast@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "::notice::electron-cast@${GITHUB_REF_NAME#v} is already on npm; checking only"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npm run check
      # A version with a "-" (0.5.0-next.1) is a prerelease: it goes to the "next" dist-tag, so `npm i electron-cast`
      # keeps installing the last release and `npm i electron-cast@next` gets this one. Without --tag npm would move
      # "latest" to it (npm 11 refuses to publish a prerelease without a tag).
      - if: steps.published.outputs.skip != 'true'
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) npm publish --access public --tag next ;;
            *) npm publish --access public ;;
          esac
