name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "**/*.md"
      - "package.json"
      - ".github/workflows/pages.yml"
  # The site builds every Markdown file in the repository, so a pull request that changes one builds it too (no deploy).
  pull_request:
    paths:
      - "site/**"
      - "**/*.md"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Deploys queue one at a time; a pull request's build check runs in its own group.
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
